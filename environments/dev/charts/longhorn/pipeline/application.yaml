apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-dev
  namespace: argocd
  annotations:
    # Sync wave controls deployment order (lower numbers first)
    # Wave 0: Core infrastructure (networking, storage)
    # Wave 1: Critical services (ingress controllers, cert-manager)
    # Wave 2: Storage solutions (Longhorn)
    # Wave 3+: Application workloads
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/zeeemughal/example-argocd.git
    targetRevision: HEAD
    path: environments/dev/charts/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  revisionHistoryLimit: 3
