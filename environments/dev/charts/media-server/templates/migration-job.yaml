{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "media-server.fullname" . }}-migration
  labels:
    {{- include "media-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migration
        image: alpine:latest
        command:
        - sh
        - -c
        - |
          echo "Starting data migration from old PVC to new ReadWriteMany PVC..."
          if [ -d "/old-data" ] && [ "$(ls -A /old-data)" ]; then
            echo "Copying data from /old-data to /new-data..."
            cp -av /old-data/* /new-data/
            echo "Migration completed successfully"
          else
            echo "No data to migrate or old PVC not mounted"
          fi
        volumeMounts:
        - name: old-storage
          mountPath: /old-data
        - name: new-storage
          mountPath: /new-data
      volumes:
      - name: old-storage
        persistentVolumeClaim:
          claimName: {{ .Values.migration.oldPvcName }}
      - name: new-storage
        persistentVolumeClaim:
          claimName: {{ .Values.storage.pvc.name }}
{{- end }}
