global:
  timezone: "Etc/UTC"
  puid: 1000
  pgid: 1000
  umask: "002"

defaultEnv:
  PUID: "1000"
  PGID: "1000"
  TZ: "Etc/UTC"
  UMASK: "002"

additionalEnv: []

storage:
  type: "pvc"
  pvc:
    create: false
    name: "media-server-pvc-rwx"
    size: "100Gi"
    storageClass: "longhorn"
    accessModes: ["ReadWriteMany"]
  existingPvc: "media-server-pvc-rwx"

ingress:
  enabled: true
  className: "nginx"
  tls:
    enabled: false
    certManager:
      enabled: false
      issuer: "letsencrypt-prod"
  annotations:
    external-dns.alpha.kubernetes.io/enabled: "true"

jellyfin:
  enabled: true
  image:
    repository: "linuxserver/jellyfin"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  initContainer:
    enabled: false
    image: "alpine:latest"
  env: []
  resources:
    enabled: false
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  volumeMounts:
    config:
      mountPath: "/config"
      subPath: "config/jf"
    media:
      mountPath: "/media"
      subPath: "media"
  service:
    type: "ClusterIP"
    port: 8096
  ingress:
    enabled: true
    hostname: "jellyfin.dev.786999.xyz"
    path: "/"
    pathType: "Prefix"
    tls:
      enabled: false
    annotations: {}

jackett:
  enabled: true
  image:
    repository: "linuxserver/jackett"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  env: []
  resources:
    enabled: false
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  volumeMounts:
    config:
      mountPath: "/config"
      subPath: "config/jackett"
    media:
      mountPath: "/media"
      subPath: "media"
  service:
    type: "ClusterIP"
    port: 9117
  ingress:
    enabled: true
    hostname: "jackett.dev.786999.xyz"
    path: "/"
    pathType: "Prefix"
    tls:
      enabled: false
    annotations: {}

bazarr:
  enabled: true
  image:
    repository: "linuxserver/bazarr"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  env: []
  resources:
    enabled: false
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  volumeMounts:
    config:
      mountPath: "/config"
      subPath: "config/bazarr"
    media:
      mountPath: "/media"
      subPath: "media"
  service:
    type: "ClusterIP"
    port: 6767
  ingress:
    enabled: true
    hostname: "bazarr.dev.786999.xyz"
    path: "/"
    pathType: "Prefix"
    tls:
      enabled: false
    annotations: {}

qbittorrent:
  enabled: true
  image:
    repository: "linuxserver/qbittorrent"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  env:
    - name: WEBUI_PORT
      value: "32080"
  resources:
    enabled: false
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  volumeMounts:
    config:
      mountPath: "/config"
      subPath: "config/qb"
    media:
      mountPath: "/media"
      subPath: "media"
  service:
    type: "ClusterIP"
    port: 32080
  ingress:
    enabled: true
    hostname: "qbittorrent.dev.786999.xyz"
    path: "/"
    pathType: "Prefix"
    tls:
      enabled: false
    annotations: {}

