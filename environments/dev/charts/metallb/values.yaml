metallb:
  controller:
    enabled: true
  speaker:
    enabled: true

# MetalLB Configuration
config:
  # Advertisement mode: l2 or bgp
  advertisementMode: "l2"
  
  # IP Address Pools
  addressPools:
    - name: default-pool
      enabled: true
      # IP address ranges (can be IPv4 or IPv6)
      addresses:
        - 10.51.1.171-10.51.1.175
        # Uncomment for additional ranges
        # - 192.168.1.240/28
        # - 2001:db8::/64  # IPv6 example
      
      # Optional: Auto-assign IPs from this pool
      autoAssign: true
      
      # Optional: Avoid specific IPs within the range
      # avoidBuggyIPs: true
  
  # BGP Configuration (only used when advertisementMode is set to "bgp")
  # Uncomment and configure these settings only when using BGP mode
  # bgp:
  #   myASN: 65001
  #   peerASN: 65000
  #   peerAddress: 192.168.1.1
